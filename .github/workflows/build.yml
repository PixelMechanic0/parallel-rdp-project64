name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip

      - name: Build 32-bit and 64-bit DLLs
        run: make -j"$(nproc)" all

      - name: Determine version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            REF="${GITHUB_REF_NAME//\//-}"
            VERSION="${REF}-${GITHUB_SHA::7}"
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Building version: ${VERSION}"

      - name: Package build
        shell: bash
        run: |
          PACKAGE_NAME="parallel-rdp-project64-${VERSION}-windows"

          rm -rf package dist
          mkdir -p package/x86 package/x64 dist

          cp build32/parallel-rdp-pj64.dll package/x86/
          cp build/parallel-rdp-pj64.dll   package/x64/

          cp README.md LICENSE THIRD_PARTY_NOTICES.md package/

          (
            cd package
            zip -r "../dist/${PACKAGE_NAME}.zip" .
          )

          (
            cd dist
            sha256sum "${PACKAGE_NAME}.zip" > SHA256SUMS.txt
          )

          echo
          echo "Release contents:"
          unzip -l "dist/${PACKAGE_NAME}.zip"

          echo
          cat dist/SHA256SUMS.txt

      # CI/manual-run artifact:
      # upload the unpacked files, NOT dist/*.zip, otherwise GitHub wraps
      # your zip in another artifact zip.
      - name: Upload build artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: parallel-rdp-project64-${{ env.VERSION }}-windows
          path: package/
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/parallel-rdp-project64-${VERSION}-windows.zip" \
            "dist/SHA256SUMS.txt" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
