name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip

      - name: Build 32-bit and 64-bit DLLs
        run: make -j"$(nproc)" all

      - name: Package builds
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          mkdir -p dist/x86 dist/x64

          cp build32/parallel-rdp-pj64.dll dist/x86/
          cp build/parallel-rdp-pj64.dll   dist/x64/
          for d in dist/x86 dist/x64; do
            cp README.md LICENSE THIRD_PARTY_NOTICES.md "$d"/
          done

          ( cd dist/x86 && zip -r "../parallel-rdp-project64-${VERSION}-x86.zip" . )
          ( cd dist/x64 && zip -r "../parallel-rdp-project64-${VERSION}-x64.zip" . )
          rm -rf dist/x86 dist/x64

          ( cd dist && sha256sum *.zip > SHA256SUMS.txt )
          cat dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parallel-rdp-project64-${{ env.VERSION }}
          path: dist/
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.zip dist/SHA256SUMS.txt \
            --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
